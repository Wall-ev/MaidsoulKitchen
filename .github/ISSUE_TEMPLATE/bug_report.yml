name: Bug Report
description: Bug report
title: "[Bug] "
labels: ["bug"]
assignees:
 - Azumic
body:
 - type: markdown
   attributes:
    value: |
     Thanks for taking the time to fill out this bug report!
 - type: textarea
   id: version
   attributes:
    label: Mpd Version
    description: |
     The version of mods you are use, eg:
     maidsoulkitchen: 1.20.1-beta-v0.1.3 (mandatory)
     touhoulittlemaid: 1.20.1-release-1.2.2 (mandatory)
     youkaishomecoming: 1.20.1-2.3.13 (optional, mods that work with the problem)
    value: |
     maidsoulkitchen: 
     touhoulittlemaid：
   validations:
    required: true
 - type: textarea
   id: what-happened
   attributes:
    label: What happened?
    description: How do you trigger this bug? Please walk us through it step by step.
    value: |
     1.
     2.
     3.
   validations:
    required: true
 - type: textarea
   id: logs
   attributes:
    label: Relevant log output
    description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
    render: shell
   validations:
    required: false