// libs自动依赖
dependencies {

    if (file("libs/${minecraft_version}/implementation").exists()) {
        for (final def file in fileTree(dir: "libs/${minecraft_version}/implementation", includes: ['*.jar']).getFiles()) {
            def name = file.getName()
            def modName = name.split("-")[0]
            def ver = name.replace("${modName}-", "").replace(".jar", "")
            println(">> Add Implementation: file: ${name}, name: ${modName}, ver: ${ver}")
            implementation fg.deobf("implibs:${name.split("-")[0]}:${ver}")
        }
    }
    if (file("libs/${minecraft_version}/compileOnly").exists()) {
        for (final def file in fileTree(dir: "libs/${minecraft_version}/compileOnly", includes: ['*.jar']).getFiles()) {
            def name = file.getName()
            def modName = name.split("-")[0]
            def ver = name.replace("${modName}-", "").replace(".jar", "")
            println(">> Add compileOnly: file: ${name}, name: ${modName}, ver: ${ver}")
            compileOnly fg.deobf("comlibs:${name.split("-")[0]}:${ver}")
        }
    }
    if (file("libs/${minecraft_version}/runtimeOnly").exists()) {
        for (final def file in fileTree(dir: "libs/${minecraft_version}/runtimeOnly", includes: ['*.jar']).getFiles()) {
            def name = file.getName()
            def modName = name.split("-")[0]
            def ver = name.replace("${modName}-", "").replace(".jar", "")
            println(">> Add runtimeOnly: file: ${name}, name: ${modName}, ver: ${ver}")
            runtimeOnly fg.deobf("runlibs:${name.split("-")[0]}:${ver}")
        }
    }
}

// util
def loadGradle(String minecraft_version) {
    apply from: "setting/common/forge/repositories.gradle"
    apply from: "setting/common/forge/dependencies.gradle"
    apply from: "setting/version/${minecraft_version}/dependencies.gradle"
}

def loadProperties(String minecraft_version) {
    loadCustomProperties("gradle.properties")
    loadCustomProperties("setting/version/${minecraft_version}/gradle.properties")
}

def loadCustomProperties(String path) {
    def customPropertiesFile = file(path)
    if (customPropertiesFile.exists()) {
        def customProperties = new Properties()
        customProperties.load(new FileInputStream(customPropertiesFile))
        customProperties.each { key, value ->
            project.ext.set(key, value)
        }
    }
}

def printProjectInfo(Project project) {
    String[] projectInfo = ['minecraft_version', 'minecraft_version_range', 'forge_version', 'forge_version_range', 'loader_version', 'loader_version_range', 'mapping_channel', 'mapping_version']
    println "> Minecraft Version"
    for (final def info in projectInfo) {
        if (project.hasProperty(info)) {
            println "${info} = ${project.property(info)}"
        }
    }
}

def printProperties(Project project) {
    println "> Custom Properties"
    project.properties.each { key, value ->
        println ">- ${key} = ${value}"
    }
}

def isTask(String... defTasks) {
    def inRunTasks = gradle.startParameter.taskNames

    for (final def inRunTask in inRunTasks) {
        for (final def defTask in defTasks) {
            if (inRunTask.contains(defTask)) {
                return true
            }
        }
    }
    return false;
}

def isTaskStartWith(String start) {
    def inRunTasks = gradle.startParameter.taskNames

    for (final def inRunTask in inRunTasks) {
        if (inRunTask.startsWith(start)) {
            return true;
        }
    }
    return false;
}


String buildGroup = "build"
tasks.register("build2Legacy") {
    group = buildGroup
    description = '构建MaidsoulKitchen给Legacy做兼容使用'

    doLast {
        exec {

            // 设置环境变量，将Gradle属性传递给批处理脚本
            environment "MOD_ID", mod_id
            environment "VERSION", version_cache
            environment "MINECRAFT_VERSION", minecraft_version

            println(MOD_ID: mod_id)
            println(VERSION: version_cache)
            println(MINECRAFT_VERSION: minecraft_version)

            commandLine = ['build2Legacy.bat']
            ignoreExitValue = false // 如果命令失败则中断构建
        }
    }
}

if (isTask("buildAll")) {
    dependencies {
        if (file("libs/${minecraft_version}/legacy").exists()) {
            for (final def file in fileTree(dir: "libs/${minecraft_version}/legacy", includes: ['*-all.jar']).getFiles()) {
                def name = file.getName()
                def modName = name.split("-")[0]
                def ver = name.replace("${modName}-", "").replace(".jar", "")
                println(">> Add legacy: file: ${name}, name: ${modName}, ver: ${ver}")
                implementation fg.deobf(jarJar("legacylibs:${name.split("-")[0]}:${ver}")) {
                    transitive = false
                    jarJar.ranged(it, "[${ver},)")
                }
            }
        }
        println "⚠️ Legacy 版本加载完成！"
    }
}

tasks.register("buildAll") {
    group = null
    description = '构建模组，由buildMod任务启动package.bat触发'
    version = "${minecraft_version}-${version_type}-v${mod_version}"

    dependsOn(rootProject.tasks.build)
}

tasks.register("buildMod") {
    group = buildGroup
    description = '打包完整的模组'
    doLast {
        exec {
            // 设置环境变量，将Gradle属性传递给批处理脚本
            environment "MOD_ID", mod_id
            environment "VERSION", version
            environment "MINECRAFT_VERSION", rootProject.ext.minecraft_version

            commandLine = ['package.bat']
            ignoreExitValue = false // 如果命令失败则中断构建
        }
    }
}

tasks.named('build') {
    // 隐藏任务，使用 buildMod 任务
//    group = null
    description =  '请使用 buildMod 任务'
}

tasks.named('init') {
    // 隐藏任务，使用 buildMod 任务
    group = "init"
    description = '项目初始化，如果使用过了 init.bat，就可以不用初始化了'
    doLast {
        exec {
            commandLine = ['init.bat']
            ignoreExitValue = false // 如果命令失败则中断构建
        }
    }
}

tasks.compileJava {
    // dsx137: 强制重新编译和生成 refmap.json 文件，避免偶发情况下该文件丢失问题
    outputs.upToDateWhen { false }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = secrets.get("curseforge_token")
    def mainFile = upload(project.curseforge_project, new File("./changelog/${mod_id}-${version}-all.jar"))
    mainFile.changelog = new File('./changelog/changelog.txt').text.split("\r\n\r\n")[0].replace(project.mod_version + "\r\n", "")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("1.20.1")
    mainFile.addModLoader("Forge")
    mainFile.addRequirement("touhou-little-maid")
//    mainFile.addOptional()
    mainFile.releaseType = project.mod_version_type
    disableVersionDetection()

    debugMode = true
}

modrinth {
    token = secrets.get("modrinth_token")
    projectId = project.modrinth_project
    versionName = "${mod_name} ${project.mod_version}"
    versionNumber = project.mod_version
    versionType = project.mod_version_type
    uploadFile = new File("./changelog/${mod_id}-${version}-all.jar")
    gameVersions = ["1.20.1"]
    loaders = ["forge"]
    changelog = new File('./changelog/changelog.txt').text.split("\r\n\r\n")[0].replace(project.mod_version + "\r\n", "")
    dependencies {
        required.project "touhou-little-maid"
    }

    debugMode = true
}