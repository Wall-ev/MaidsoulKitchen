void modrinthImpNo(String mod_slug, String mod_version) {
    this.modrinthImp(mod_slug, mod_version, false)
}

void modrinthImp(String mod_slug, String mod_version, boolean defaultImp) {
    if (mod_version == null || mod_version.isEmpty())
        return

    if (isLegacyRunTask()) {
        dependencies.with {
            compileOnly fg.deobf("maven.modrinth:${mod_slug}:${mod_version}-${mod_loader},${minecraft_version}")
        }
        return
    }

    if (defaultImp || isRunDataTask()) {
        dependencies.with {
            implementation fg.deobf("maven.modrinth:${mod_slug}:${mod_version}-${mod_loader},${minecraft_version}")
        }
    } else {
        dependencies.with {
            compileOnly fg.deobf("maven.modrinth:${mod_slug}:${mod_version}-${mod_loader},${minecraft_version}")
        }
    }
}

