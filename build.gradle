void customImp(String group, String name, String version, boolean defaultImp) {
    if (mod_version == null || mod_version.isEmpty())
        return

    dependencies.with {
        if (isLegacyRunTask()) {
            compileOnly fg.deobf("${group}:${name}:${version}")
            return
        }

        if (defaultImp || isRunDataTask()) {
            implementation fg.deobf("${group}:${name}:${version}")
        } else {
            compileOnly fg.deobf("${group}:${name}:${version}")
        }
    }
}

void customCompile(String group, String name, String version) {
    dependencies.with {
        compileOnly fg.deobf("${group}:${name}:${version}")
    }
}

void customRuntime(String group, String name, String version) {
    if (isLegacyRunTask()) {
        return
    }

    dependencies.with {
        runtimeOnly fg.deobf("${group}:${name}:${version}")
    }
}


boolean isRunDataTask() {
    return gradle.startParameter.taskNames.any { it.contains("runData") }
}

boolean isBuildTask() {
    return gradle.startParameter.taskNames.any { it.contains("build") }
}

boolean isLegacyRunTask() {
    return project.hasProperty('loadedByLegacy') && project.property('loadedByLegacy').toBoolean()
}

tasks.register("buildMod") {
    description = "在上一级目录以命令行方式执行runData后，再执行原生build任务"
    group = "Build"

    doLast {
        // 获取上一级目录的绝对路径
        def parentDir = rootDir
        println "上一级目录绝对路径: ${parentDir}"

        // 判断操作系统并设置正确的脚本和命令格式
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def gradlewScript = isWindows ? "gradlew.bat" : "gradlew"

        // 构建完整的脚本路径（使用绝对路径避免相对路径问题）
        def gradlewPath = new File(parentDir, gradlewScript).absolutePath
        println "Gradle脚本路径: ${gradlewPath}"

        // 验证文件是否存在
        def gradlewFile = new File(gradlewPath)
        if (!gradlewFile.exists()) {
            throw new GradleException("找不到Gradle脚本: ${gradlewPath}，请检查路径是否正确")
        }

        // 1. 执行runData
        println "开始执行runData..."
        exec {
            workingDir parentDir
            // 分离命令和参数，避免解析问题
            commandLine = isWindows ? [gradlewPath, "runData", "--console=plain"] :
                    ["/bin/bash", gradlewPath, "runData", "--console=plain"]
            standardOutput = System.out
            errorOutput = System.err
        }

        // 2. 执行build
        println "runData执行完成，开始执行build..."
        exec {
            workingDir parentDir
            commandLine = isWindows ? [gradlewPath, "build", "--console=plain"] :
                    ["/bin/bash", gradlewPath, "build", "--console=plain"]
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}