void curseForgeImp(String mod_slug, String mod_version) {
    this.curseForgeImp(mod_slug, mod_version, true)
}

void curseForgeImpNo(String mod_slug, String mod_version) {
    this.curseForgeImp(mod_slug, mod_version, false)
}

void curseForgeImp(String mod_slug, String mod_version, boolean defaultImp) {
    if (mod_version == null || mod_version.isEmpty())
        return

    if (isLegacyRunTask()) {
        dependencies.with {
            compileOnly fg.deobf("curse.maven:${mod_slug}:${mod_version}")
        }
        return
    }

    if (defaultImp || isRunDataTask()) {
        // 使用 with() 方法将上下文切换到 dependencies 闭包
        dependencies.with {
            implementation fg.deobf("curse.maven:${mod_slug}:${mod_version}")
        }
    } else {
        // 使用 with() 方法将上下文切换到 dependencies 闭包
        dependencies.with {
            compileOnly fg.deobf("curse.maven:${mod_slug}:${mod_version}")
        }
    }
}

