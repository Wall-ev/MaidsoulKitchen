tasks.register("buildMod") {
    description = "在上一级目录以命令行方式执行runData后，再执行原生build任务"
    group = "Build"

    doLast {
        // 获取上一级目录的绝对路径
        def parentDir = projectDir.parentFile.absolutePath
        println "上一级目录绝对路径: ${parentDir}"

        // 判断操作系统并设置正确的脚本和命令格式
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def gradlewScript = isWindows ? "gradlew.bat" : "gradlew"

        // 构建完整的脚本路径（使用绝对路径避免相对路径问题）
        def gradlewPath = new File(parentDir, gradlewScript).absolutePath
        println "Gradle脚本路径: ${gradlewPath}"

        // 验证文件是否存在
        def gradlewFile = new File(gradlewPath)
        if (!gradlewFile.exists()) {
            throw new GradleException("找不到Gradle脚本: ${gradlewPath}，请检查路径是否正确")
        }

        // 1. 执行runData
        println "开始执行runData..."
        exec {
            workingDir parentDir
            // 分离命令和参数，避免解析问题
            commandLine = isWindows ? [gradlewPath, ":Main:runData", "--console=plain"] :
                    ["/bin/bash", gradlewPath, ":Main:runData", "--console=plain"]
            standardOutput = System.out
            errorOutput = System.err
        }

        // 2. 执行build
        println "runData执行完成，开始执行build..."
        exec {
            workingDir parentDir
            commandLine = isWindows ? [gradlewPath, ":Main:build", "--console=plain"] :
                    ["/bin/bash", gradlewPath, ":Main:build", "--console=plain"]
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}





tasks.register("buildModWithWSL") {
    description = "在 WSL 中构建模组（兼容IDEA的WSL环境）"
    group = "Build"

    doLast {
        def projectDirFile = rootProject.projectDir as File
        def windowsProjectPath = projectDirFile.absolutePath
        println "本地项目路径: ${windowsProjectPath}"

        // 动态转换为WSL路径格式
        def wslProjectPath = windowsProjectPath
                .replace('\\', '/')
                .replaceAll(/([A-Z]):/, { matcher ->
                    def driveLetter = matcher[1].toLowerCase()
                    return "/mnt/${driveLetter}"
                })

        println "WSL项目路径: ${wslProjectPath}"

        // 关键：指定发行版并加载用户环境（--login确保让bash加载.profile文件）
        def wslDistro = "Ubuntu-22.04"  // 替换为你的WSL发行版名称
        def javaCheckCommand = "java -version && javac -version && echo \$JAVA_HOME"
        def javaCheckOutput = new ByteArrayOutputStream()

        exec {
            // 使用--login参数确保加载.bashrc/.profile中的环境变量
            commandLine "wsl", "--distribution", wslDistro, "bash", "--login", "-c", javaCheckCommand
            standardOutput = javaCheckOutput
            errorOutput = new ByteArrayOutputStream()
        }
        println "WSL Java环境检查:\n${javaCheckOutput.toString()}"

        // 构建命令（同样使用--login参数）
        def buildCommand = """
            cd '${wslProjectPath}' && \
            chmod +x gradlew && \
            ./gradlew runData && \
            ./gradlew build
            """.trim().replace("\n", " ")

        def buildOutput = new ByteArrayOutputStream()
        def buildError = new ByteArrayOutputStream()
        exec {
            commandLine "wsl", "--distribution", wslDistro, "bash", "--login", "-c", buildCommand
            standardOutput = buildOutput
            errorOutput = buildError
        }

        println "WSL 构建输出:\n${buildOutput.toString()}"
        if (buildError.toString()) {
            println "WSL 构建错误:\n${buildError.toString()}"
        }
    }
}
